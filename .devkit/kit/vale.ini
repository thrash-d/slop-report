StylesPath = ../vale
Vocab = Repo
MinAlertLevel = suggestion

[formats]
mjs = js
cjs = js
mts = ts
cts = ts

[*.{md,txt}]
BasedOnStyles = NoSlop
# Quoted speech and blockquotes are someone else's words, not the draft's prose.
# An acronym's expansion, "MFA (Multi-Factor Authentication)", and an ID in
# parentheses, "(3.4.9)" or "(AC.L2-3.1.5)", aren't asides or title case.
# An editor note in brackets, "[TODO: ...]" or "[VERIFY: ...]", isn't prose.
TokenIgnores = ("[^"\n]+?"), (\b[A-Z][A-Za-z0-9&]*[A-Z][a-z]?s? \([^()\n]+\)), (\([A-Za-z0-9.:/-]*\d[A-Za-z0-9.:/-]*\)), (\[[A-Z][A-Z]+:[^\]\n]+\])
BlockIgnores = (?m)^>[^\n]*$

# LinkedIn-style posts opt in by file name. They also get the [*.{md,txt}]
# settings above, including the ignores, because Vale merges matching sections.
[*.linkedin.{md,txt}]
BasedOnStyles = NoSlop, NoSlopLinkedIn

# HTML gets its own section because Vale applies TokenIgnores to the raw
# source. The quoted-speech pattern would eat attribute values like id="x" and
# break the tags, leaking '"x">' into heading text.
[*.html]
BasedOnStyles = NoSlop
TokenIgnores = (\b[A-Z][A-Za-z0-9&]*[A-Z][a-z]?s? \([^()\n]+\)), (\([A-Za-z0-9.:/-]*\d[A-Za-z0-9.:/-]*\))

# CLAUDE.md is AI-facing config read by hooks, not a shipped doc. Emphasis and
# shout-labels there are functional, so it's exempt from the prose style. The
# **/ prefix matches nested and absolute paths, not just a bare "CLAUDE.md".
[**/CLAUDE.md]
BasedOnStyles =

# Code: only comments and docstrings get linted. Essay-only rules are off.
[*.{py,js,jsx,mjs,cjs,ts,tsx,mts,cts,ps1,psm1,go,rs,c,cpp,h,cs,java,rb,lua,php}]
BasedOnStyles = NoSlop, NoSlopCode
NoSlop.HeadingCase = NO
NoSlop.Contractions = NO
NoSlop.HeresTheThing = NO
NoSlop.Journey = NO
NoSlop.NotXItsY = NO
NoSlop.Bold = NO
NoSlop.InlineHeaderList = NO
NoSlop.SentenceStart = NO
NoSlop.EmojiStructure = NO
NoSlop.Semicolons = NO
NoSlop.AIAdverbs = NO
NoSlop.Repetition = NO
NoSlop.CurlyQuotes = NO
NoSlop.AIWordsSoft = suggestion
NoSlop.PlainWordsSoft = NO
NoSlop.Underscore = NO
