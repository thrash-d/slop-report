# Used by devkit-quality only when the repo has no ruff config of its own.
# The rule set catches real bugs, not style: syntax errors, undefined names,
# unused imports and variables, likely bugs (bugbear), and strings that look
# like f-strings but are missing the f prefix.
target-version = "py312"
extend-exclude = [".devkit", "node_modules", "dist", "build", "static"]
preview = true

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B", "RUF027"]
# B008 fires on FastAPI's Depends() defaults. B904 is noisy on existing code.
ignore = ["B008", "B904"]
explicit-preview-rules = true
