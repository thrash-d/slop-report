# Kit-owned gitleaks config. devkit.ps1 update overwrites this file, so rules
# added here reach every repo. It extends the repo's own .devkit/gitleaks.toml,
# which keeps the repo's allowlist. The path resolves from the repo root.
[extend]
path = ".devkit/gitleaks.toml"

# gitleaks' built-in rules miss Discord webhook URLs. Anyone holding one can
# post to the channel.
[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]{20,}'''
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]

# Google OAuth formats. The built-in rules miss client_secret.json entirely and
# catch a saved token.json only by its generic entropy check.
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["GOCSPX-"]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[A-Za-z0-9_-]{40,}'''
keywords = ["1//0"]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''ya29\.[A-Za-z0-9_-]{20,}'''
keywords = ["ya29."]
